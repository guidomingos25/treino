<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Programação</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --border: #d8e0ea;
      --border-soft: #e8edf3;
      --text: #172033;
      --muted: #64748b;
      --primary: #176b4d;
      --primary-dark: #0f5138;
      --primary-soft: #e8f5ee;
      --shadow: 0 16px 36px rgba(15, 23, 42, 0.10);
      --shadow-soft: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(23, 107, 77, 0.10), transparent 30%),
        linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
    }

    .app-shell {
      width: 100%;
      max-width: 100%;
      padding: 22px 30px 28px 22px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 18px 20px;
      background: linear-gradient(135deg, #ffffff 0%, #f7fbf9 100%);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      margin-bottom: 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.2vw, 32px);
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: #0f172a;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .painel-controles {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(6px);
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      margin: 0;
    }

    .filtros label {
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    select,
    input[type="text"] {
      min-height: 34px;
      padding: 7px 10px;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    select:focus,
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 107, 77, 0.14);
    }

    #filtroGeral { width: min(280px, 100%); }
    #filtroCliente, #filtroUF, #filtroDia { max-width: 240px; }

    .acoes-relatorio {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-left: auto;
    }

    .btn-relatorio {
      min-height: 36px;
      padding: 8px 13px;
      border: 1px solid transparent;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn-relatorio:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.12);
    }

    .btn-excel {
      color: #ffffff;
      background: linear-gradient(135deg, #16834f, #0f6b3e);
    }

    .btn-pdf {
      color: #ffffff;
      background: linear-gradient(135deg, #b42318, #8f1d15);
    }

    #loading {
      margin: 18px 0;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
    }

    .table-card {
      width: 100%;
      max-width: 100%;
      padding: 10px 10px 12px 12px;
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .table-wrapper {
      width: 100%;
      max-width: 100%;
      overflow: auto;
      padding: 0 10px 10px 0;
      scrollbar-gutter: stable both-edges;
    }

    table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: auto;
      background: white;
      border: 1px solid var(--border-soft);
      border-radius: 13px;
      overflow: hidden;
    }

    th,
    td {
      border-right: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
      padding: 8px 9px;
      text-align: center;
      font-size: 12px;
      line-height: 1.25;
      vertical-align: middle;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    th:last-child,
    td:last-child { border-right: 0; }

    tr:last-child td { border-bottom: 0; }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      color: #ffffff;
      background: linear-gradient(180deg, #1b7a58 0%, #136345 100%);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      background: linear-gradient(180deg, #218a64 0%, #176b4d 100%);
    }

    tbody tr:nth-child(even) { background-color: #f8fafc; }
    tbody tr:hover { background-color: #edf7f1; }

    .ordenacao {
      margin-left: 6px;
      font-size: 11px;
      font-weight: 900;
    }

    .col-almox-destino {
      white-space: nowrap !important;
      word-break: keep-all !important;
      overflow-wrap: normal !important;
    }

    tbody td.col-almox-destino {
      text-align: left;
      font-weight: 700;
      color: #0f172a;
    }

    @media (max-width: 900px) {
      .app-shell { padding: 12px 16px 18px 10px; }
      .page-header { padding: 14px; border-radius: 14px; }
      .painel-controles { align-items: stretch; }
      .filtros, .acoes-relatorio { width: 100%; justify-content: flex-start; }
      #filtroGeral, #filtroCliente, #filtroUF, #filtroDia { width: 100%; max-width: 100%; }
      .btn-relatorio { flex: 1 1 180px; }
      table { min-width: 980px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <div>
        <span class="eyebrow">Painel de Programação</span>
        <h1>Programação de cargas Della Volpe</h1>
        <p class="subtitle">Visualização consolidada com filtros, ordenação e relatórios para exportação.</p>
      </div>
    </header>

    <section class="painel-controles">
      <div class="filtros">
        <label for="filtroCliente">Cliente:</label>
        <select id="filtroCliente">
          <option value="">Todos</option>
        </select>

        <label for="filtroUF">UF:</label>
        <select id="filtroUF">
          <option value="">Todos</option>
        </select>

        <label for="filtroDia">Dia da Semana:</label>
        <select id="filtroDia">
          <option value="">Todos</option>
          <option value="SEG">Segunda (SEG)</option>
          <option value="TER">Terça (TER)</option>
          <option value="QUA">Quarta (QUA)</option>
          <option value="QUI">Quinta (QUI)</option>
          <option value="SEX">Sexta (SEX)</option>
          <option value="SAB">Sábado (SAB)</option>
          <option value="DOM">Domingo (DOM)</option>
        </select>

        <label for="filtroGeral">Pesquisar:</label>
        <input type="text" id="filtroGeral" placeholder="Digite para filtrar...">
      </div>

      <div class="acoes-relatorio">
        <button type="button" class="btn-relatorio btn-excel" id="btnExcel">Gerar relatório Excel</button>
        <button type="button" class="btn-relatorio btn-pdf" id="btnPDF">Gerar relatório PDF</button>
      </div>
    </section>

    <div id="loading">Carregando dados...</div>

    <section class="table-card">
      <div class="table-wrapper">
        <table id="tabela" style="display:none;">
          <thead id="cabecalho"></thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkREcLQFJhAsxEq3WRVxHtYw46zSe3sDVJcQWOreQzFs6-u6PWF-cI8ndRTkQUFXfurUkkog0-NrZq/pub?output=csv";

    let dados = [];
    let dadosFiltrados = [];
    let cabecalho = [];
    let ordem = { coluna: null, crescente: true };

    const diaParaNumero = { 'SEG': 1, 'TER': 2, 'QUA': 3, 'QUI': 4, 'SEX': 5, 'SAB': 6, 'DOM': 7 };
    const formasDia = {
      'SEG': ['SEG', 'SEGUNDA', 'SEGUNDA-FEIRA', 'SEGUNDA FEIRA'],
      'TER': ['TER', 'TERCA', 'TERÇA', 'TERÇA-FEIRA', 'TERCA-FEIRA', 'TERCA FEIRA'],
      'QUA': ['QUA', 'QUARTA', 'QUARTA-FEIRA', 'QUARTA FEIRA'],
      'QUI': ['QUI', 'QUINTA', 'QUINTA-FEIRA', 'QUINTA FEIRA'],
      'SEX': ['SEX', 'SEXTA', 'SEXTA-FEIRA', 'SEXTA FEIRA'],
      'SAB': ['SAB', 'SÁBADO', 'SABADO'],
      'DOM': ['DOM', 'DOMINGO']
    };

    fetch(url)
      .then(res => res.text())
      .then(csv => {
        const linhas = parseCSV(csv);
        const nonEmpty = linhas.filter(r => r.some(c => c && c.trim() !== ""));
        cabecalho = nonEmpty[0].map(c => c.trim());
        dados = nonEmpty.slice(1).map(l => {
          const row = l.map(c => c.trim());
          while (row.length < cabecalho.length) row.push("");
          return row;
        });

        montarCabecalho();
        montarOpcoesCliente();
        montarOpcoesUF();
        atualizarTabela();

        document.getElementById("loading").style.display = "none";
        document.getElementById("tabela").style.display = "table";
      })
      .catch(err => {
        document.getElementById("loading").innerText = "Erro ao carregar planilha.";
        console.error(err);
      });

    function normalizarHeader(valor) {
      return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toUpperCase();
    }

    function getIndiceUF() {
      let idx = cabecalho.findIndex(h => normalizarHeader(h) === "UF");
      if (idx !== -1) return idx;
      return cabecalho.findIndex(h => normalizarHeader(h) === "UF DESTINO" || normalizarHeader(h).startsWith("UF "));
    }

    function parseCSV(texto) {
      const linhas = [];
      let linha = [];
      let campo = "";
      let dentroAspas = false;

      for (let i = 0; i < texto.length; i++) {
        const char = texto[i];
        const prox = texto[i + 1];

        if (char === '"') {
          if (dentroAspas && prox === '"') {
            campo += '"';
            i++;
          } else {
            dentroAspas = !dentroAspas;
          }
        } else if (char === ',' && !dentroAspas) {
          linha.push(campo);
          campo = "";
        } else if ((char === '\n' || char === '\r') && !dentroAspas) {
          if (char === '\r' && prox === '\n') i++;
          linha.push(campo);
          linhas.push(linha);
          linha = [];
          campo = "";
        } else {
          campo += char;
        }
      }

      if (campo !== "" || linha.length) {
        linha.push(campo);
        linhas.push(linha);
      }
      return linhas;
    }

    function getIndiceDiaSemana() {
      return cabecalho.findIndex(h => normalizarHeader(h).includes("DIA DA SEMANA"));
    }

    function indicesVisiveis() {
      const idxDiaSemana = getIndiceDiaSemana();
      return cabecalho.map((_, i) => i).filter(i => i !== idxDiaSemana);
    }

    function classeColuna(idx) {
      const nome = normalizarHeader(cabecalho[idx]);
      return nome === "ALMOX DESTINO" || nome.includes("ALMOX DESTINO") ? "col-almox-destino" : "";
    }

    function montarCabecalho() {
      const linhaCab = document.createElement("tr");

      indicesVisiveis().forEach(i => {
        const th = document.createElement("th");
        th.textContent = cabecalho[i];
        th.dataset.colIndex = String(i);
        const classe = classeColuna(i);
        if (classe) th.classList.add(classe);
        th.addEventListener("click", () => ordenarPor(i));
        linhaCab.appendChild(th);
      });

      document.getElementById("cabecalho").innerHTML = "";
      document.getElementById("cabecalho").appendChild(linhaCab);
    }

    function montarOpcoesCliente() {
      const idxCliente = cabecalho.findIndex(h => h.toUpperCase() === "CLIENTE");
      if (idxCliente === -1) return;
      const clientes = [...new Set(dados.map(l => l[idxCliente]).filter(c => c))].sort();
      const select = document.getElementById("filtroCliente");
      clientes.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
    }

    function montarOpcoesUF() {
      const idxUF = getIndiceUF();
      const select = document.getElementById("filtroUF");
      if (!select) return;

      select.innerHTML = '<option value="">Todos</option>';
      if (idxUF === -1) return;

      const ufs = [...new Set(
        dados
          .map(l => (l[idxUF] || "").trim().toUpperCase())
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b));

      ufs.forEach(uf => {
        const opt = document.createElement("option");
        opt.value = uf;
        opt.textContent = uf;
        select.appendChild(opt);
      });
    }

    function ordenarPor(idx) {
      if (ordem.coluna === idx) {
        ordem.crescente = !ordem.crescente;
      } else {
        ordem.coluna = idx;
        ordem.crescente = true;
      }

      dados.sort((a, b) => {
        const valA = (a[idx] || "").toUpperCase();
        const valB = (b[idx] || "").toUpperCase();
        if (!isNaN(valA) && !isNaN(valB)) {
          return ordem.crescente ? valA - valB : valB - valA;
        }
        return ordem.crescente ? valA.localeCompare(valB) : valB.localeCompare(valA);
      });

      const ths = document.querySelectorAll("#cabecalho th");
      ths.forEach(th => th.textContent = cabecalho[Number(th.dataset.colIndex)] || th.textContent);
      const thOrdenado = document.querySelector(`#cabecalho th[data-col-index="${idx}"]`);
      if (thOrdenado) {
        const seta = ordem.crescente ? "↑" : "↓";
        thOrdenado.innerHTML = `${cabecalho[idx]} <span class="ordenacao">${seta}</span>`;
      }

      atualizarTabela();
    }

    function atualizarTabela() {
      const cliente = document.getElementById("filtroCliente").value;
      const uf = document.getElementById("filtroUF").value;
      const dia = document.getElementById("filtroDia").value;
      const textoGeral = document.getElementById("filtroGeral").value.toLowerCase().trim();

      let filtrados = [...dados];

      if (cliente) {
        const idxCliente = cabecalho.findIndex(h => normalizarHeader(h) === "CLIENTE");
        if (idxCliente !== -1)
          filtrados = filtrados.filter(l => (l[idxCliente] || "") === cliente);
      }

      if (uf) {
        const idxUF = getIndiceUF();
        if (idxUF !== -1)
          filtrados = filtrados.filter(l => (l[idxUF] || "").trim().toUpperCase() === uf);
      }

      if (dia) {
        const idxDiaSemana = getIndiceDiaSemana();
        if (idxDiaSemana !== -1) {
          filtrados = filtrados.filter(l => {
            const val = (l[idxDiaSemana] || "").toUpperCase().trim();
            if (!val) return false;
            if (/^\d+$/.test(val)) return Number(val) === diaParaNumero[dia];
            if (val.includes(dia)) return true;
            const formas = formasDia[dia] || [];
            return formas.some(f => val.includes(f));
          });
        } else {
          const idxDia = cabecalho.findIndex(h => normalizarHeader(h) === dia);
          if (idxDia !== -1) {
            filtrados = filtrados.filter(l => {
              const v = (l[idxDia] || "").toUpperCase().trim();
              return v === "1" || v === "SIM" || v === "X";
            });
          }
        }
      }

      if (textoGeral) {
        filtrados = filtrados.filter(linha =>
          linha.some(cel => String(cel || "").toLowerCase().includes(textoGeral))
        );
      }

      dadosFiltrados = filtrados;

      const colunasVisiveis = indicesVisiveis();
      const corpo = document.getElementById("corpo");

      corpo.innerHTML = filtrados
        .map(linha => {
          const tds = colunasVisiveis
            .map(j => {
              const classe = classeColuna(j);
              return `<td${classe ? ` class="${classe}"` : ""}>${escapeHtml(linha[j] || "")}</td>`;
            })
            .join("");

          return `<tr>${tds}</tr>`;
        })
        .join("");

      aplicarPinturasEEventos();
    }

    function aplicarPinturasEEventos() {
      const corpo = document.getElementById("corpo");
      const linhas = corpo.querySelectorAll("tr");

      linhas.forEach(tr => {
        const tds = tr.querySelectorAll("td");
        // pintar as últimas 14 colunas (se existirem)
        const ultimas14 = Array.from(tds).slice(-14);
        const primeiras7 = ultimas14.slice(0, 7);
        const ultimas7 = ultimas14.slice(7);

        primeiras7.forEach(td => {
          if (td.textContent.trim() !== "") td.style.backgroundColor = "#d3d3d3";
          else td.style.backgroundColor = "";
        });

        ultimas7.forEach(td => {
          if (td.textContent.trim() !== "") td.style.backgroundColor = "#add8e6";
          else td.style.backgroundColor = "";
        });
      });
    }


    // utilitário para escapar texto antes de inserir em value/html
    function escapeHtml(unsafe) {
      return String(unsafe)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function nomeArquivo(extensao) {
      const agora = new Date();
      const pad = n => String(n).padStart(2, "0");
      const stamp = `${agora.getFullYear()}${pad(agora.getMonth() + 1)}${pad(agora.getDate())}_${pad(agora.getHours())}${pad(agora.getMinutes())}`;
      return `programacao_cargas_${stamp}.${extensao}`;
    }

    function obterDadosRelatorio() {
      const colunasVisiveis = indicesVisiveis();
      return {
        headers: colunasVisiveis.map(i => cabecalho[i]),
        rows: dadosFiltrados.map(linha => colunasVisiveis.map(i => linha[i] || ""))
      };
    }

    function gerarRelatorioExcel() {
      const { headers, rows } = obterDadosRelatorio();

      if (!headers.length) {
        alert("Nenhum dado carregado para gerar o relatório.");
        return;
      }

      if (window.XLSX) {
        const worksheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);
        worksheet["!cols"] = headers.map((header, idx) => {
          const maxConteudo = Math.max(
            String(header || "").length,
            ...rows.map(row => String(row[idx] || "").length)
          );
          return { wch: Math.min(Math.max(maxConteudo + 2, 10), 42) };
        });

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Programação");
        XLSX.writeFile(workbook, nomeArquivo("xlsx"));
        return;
      }

      const csv = [headers, ...rows]
        .map(row => row.map(campo => `"${String(campo).replace(/"/g, '""')}"`).join(";"))
        .join("\n");

      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = nomeArquivo("csv");
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function gerarRelatorioPDF() {
      const { headers, rows } = obterDadosRelatorio();

      if (!headers.length) {
        alert("Nenhum dado carregado para gerar o relatório.");
        return;
      }

      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("Não foi possível carregar a biblioteca de PDF. Verifique sua conexão com a internet e tente novamente.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
      const dataGeracao = new Date().toLocaleString("pt-BR");

      doc.setFont("helvetica", "bold");
      doc.setFontSize(13);
      doc.text("Programação de cargas Della Volpe", 40, 34);

      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.text(`Gerado em: ${dataGeracao}`, 40, 48);
      doc.text(`Registros: ${rows.length}`, 40, 60);

      if (typeof doc.autoTable !== "function") {
        alert("Não foi possível carregar o complemento de tabela para PDF. Verifique sua conexão com a internet e tente novamente.");
        return;
      }

      doc.autoTable({
        head: [headers],
        body: rows,
        startY: 74,
        theme: "grid",
        styles: {
          fontSize: 6,
          cellPadding: 3,
          overflow: "linebreak",
          valign: "middle",
          halign: "center"
        },
        headStyles: {
